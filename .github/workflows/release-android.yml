name: Android public release artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-android:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required signing secrets
        shell: bash
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEY_BASE64" || { echo "ANDROID_KEY_BASE64 ausente" >&2; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "ANDROID_KEY_ALIAS ausente" >&2; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "ANDROID_KEY_PASSWORD ausente" >&2; exit 1; }

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android platform and NDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rust + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm install

      - name: Test signing patcher
        run: npm run android:signing:test

      - name: Initialize Tauri Android project
        run: npm run tauri -- android init --ci

      - name: Validate signing patch against generated Gradle
        run: npm run android:signing:check

      - name: Generate official Android launcher icons
        run: npm run tauri -- icon public/livia/livia-mark.svg

      - name: Materialize Android upload key
        shell: bash
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/livia-upload-key.jks"
          printf '%s' "$ANDROID_KEY_BASE64" | base64 --decode > "$key_path"

          keytool -list             -keystore "$key_path"             -storepass "$ANDROID_KEY_PASSWORD"             -alias "$ANDROID_KEY_ALIAS" >/dev/null

          escape_property() {
            printf '%s' "$1" | sed -e 's/\\/\\\\/g' -e 's/:/\\:/g' -e 's/=/\\=/g'
          }

          {
            printf 'keyAlias=%s\n' "$(escape_property "$ANDROID_KEY_ALIAS")"
            printf 'password=%s\n' "$(escape_property "$ANDROID_KEY_PASSWORD")"
            printf 'storeFile=%s\n' "$(escape_property "$key_path")"
          } > src-tauri/gen/android/keystore.properties

      - name: Configure release signing
        run: npm run android:signing:patch

      - name: Build signed Android App Bundle
        run: npm run tauri -- android build --aab

      - name: Build signed Android APK
        run: npm run tauri -- android build --apk

      - name: Verify signatures and prepare checksums
        id: artifacts
        shell: bash
        run: |
          set -euo pipefail

          aab="$(find src-tauri/gen/android/app/build/outputs/bundle -type f -name '*.aab' | head -n 1)"
          apk="$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' | grep -v '/debug/' | head -n 1)"

          test -n "$aab" || { echo "AAB release não encontrado." >&2; exit 1; }
          test -n "$apk" || { echo "APK release não encontrado." >&2; exit 1; }

          jarsigner -verify -strict -certs "$aab" >/dev/null
          apksigner verify --verbose "$apk" >/dev/null

          version="$(node -p "require('./package.json').version")"
          out="$RUNNER_TEMP/livia-android-release"
          mkdir -p "$out"

          aab_out="$out/L.I.V.I.A._${version}_android-universal-release.aab"
          apk_out="$out/L.I.V.I.A._${version}_android-universal-release.apk"

          cp "$aab" "$aab_out"
          cp "$apk" "$apk_out"

          sha256sum "$aab_out" | sed "s#  .*#  $(basename "$aab_out")#" > "${aab_out}.sha256"
          sha256sum "$apk_out" | sed "s#  .*#  $(basename "$apk_out")#" > "${apk_out}.sha256"

          echo "directory=$out" >> "$GITHUB_OUTPUT"

      - name: Upload signed Android release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LIVIA-android-signed-release
          path: ${{ steps.artifacts.outputs.directory }}/*
          if-no-files-found: error
          retention-days: 14
