name: Release stable desktop

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.preflight.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Validate stable version
        id: preflight
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $cargo = Get-Content src-tauri/Cargo.toml -Raw
          $tauri = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $version = $package.version

          if ($version -notmatch '^[1-9]\d*\.\d+\.\d+$') {
            throw "A release estável exige SemVer final (ex.: 1.0.0). Encontrado: $version"
          }

          $cargoPattern = '(?m)^version\s*=\s*"' + [regex]::Escape($version) + '"$'
          if ($cargo -notmatch $cargoPattern) {
            throw "Cargo.toml não está alinhado com package.json ($version)."
          }

          if ($tauri.version -ne $version) {
            throw "tauri.conf.json não está alinhado com package.json ($version)."
          }

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Require and import Authenticode certificate
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE)) {
            throw "Secret WINDOWS_CERTIFICATE ausente. A release estável não será publicada sem assinatura."
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            throw "Secret WINDOWS_CERTIFICATE_PASSWORD ausente."
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_TIMESTAMP_URL)) {
            throw "Variable WINDOWS_TIMESTAMP_URL ausente. Use o timestamp server indicado pela autoridade certificadora."
          }

          $certificateDir = Join-Path $env:RUNNER_TEMP "livia-certificate"
          New-Item -ItemType Directory -Force -Path $certificateDir | Out-Null
          $pfxPath = Join-Path $certificateDir "certificate.pfx"

          try {
            [IO.File]::WriteAllBytes(
              $pfxPath,
              [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
            )
          } catch {
            throw "WINDOWS_CERTIFICATE não contém um PFX válido codificado em Base64."
          }

          $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $cert = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $password

          if (-not $cert -or -not $cert.HasPrivateKey) {
            throw "O certificado importado não possui chave privada utilizável."
          }

          $thumbprint = $cert.Thumbprint.Replace(" ", "").ToUpperInvariant()
          "LIVIA_WINDOWS_SIGNER_THUMBPRINT=$thumbprint" | Out-File -FilePath $env:GITHUB_ENV -Append

          $config = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          if (-not $config.bundle.PSObject.Properties['windows']) {
            $config.bundle | Add-Member -NotePropertyName windows -NotePropertyValue ([pscustomobject]@{})
          }
          $config.bundle.windows | Add-Member -Force -NotePropertyName certificateThumbprint -NotePropertyValue $thumbprint
          $config.bundle.windows | Add-Member -Force -NotePropertyName digestAlgorithm -NotePropertyValue "sha256"
          $config.bundle.windows | Add-Member -Force -NotePropertyName timestampUrl -NotePropertyValue $env:WINDOWS_TIMESTAMP_URL
          $config | ConvertTo-Json -Depth 100 | Set-Content src-tauri/tauri.conf.json

      - name: Install frontend dependencies
        run: npm install

      - name: Build signed Windows installer
        run: npm run tauri -- build --bundles nsis

      - name: Verify publisher and publish stable Windows release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ steps.preflight.outputs.version }}"
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1

          if (-not $installer) {
            throw "Instalador NSIS não encontrado."
          }

          $signature = Get-AuthenticodeSignature -LiteralPath $installer.FullName
          if ($signature.Status -ne "Valid" -or -not $signature.SignerCertificate) {
            throw "O instalador não possui assinatura Authenticode válida."
          }

          $actualThumbprint = $signature.SignerCertificate.Thumbprint.Replace(" ", "").ToUpperInvariant()
          if ($actualThumbprint -ne $env:LIVIA_WINDOWS_SIGNER_THUMBPRINT) {
            throw "O instalador foi assinado por um certificado diferente do certificado importado."
          }

          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksum = "$($installer.FullName).sha256"
          Set-Content -Path $checksum -Value "$hash  $($installer.Name)" -NoNewline

          gh release create "v$version" $installer.FullName $checksum --title "L.I.V.I.A. v$version" --notes "Primeira release desktop estável da L.I.V.I.A. Windows assinado com Authenticode; Linux publicado em AppImage e .deb; índice local com recuperação segura, updater com validação SHA-256 e verificação de publisher nas builds assinadas."

  linux:
    needs: windows
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm install

      - name: Build Linux packages
        run: npm run tauri -- build --bundles appimage,deb

      - name: Publish Linux packages and checksums
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ needs.windows.outputs.version }}"
          shopt -s nullglob
          files=(
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          )

          if [ "${#files[@]}" -eq 0 ]; then
            echo "Nenhum pacote Linux encontrado." >&2
            exit 1
          fi

          upload=()
          for installer in "${files[@]}"; do
            checksum="${installer}.sha256"
            hash="$(sha256sum "$installer" | awk '{print $1}')"
            printf '%s  %s' "$hash" "$(basename "$installer")" > "$checksum"
            upload+=("$installer" "$checksum")
          done

          gh release upload "v$version" "${upload[@]}" --clobber
