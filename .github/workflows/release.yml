name: Release

on:
  push:
    branches: ["main"]
    paths:
      - "package.json"
      - "src-tauri/Cargo.toml"
      - "src-tauri/tauri.conf.json"
  workflow_dispatch:
    inputs:
      republish:
        description: "Republicar uma versão que já existe"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  channel:
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect release channel
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_REPUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.republish || false }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          major="${version%%.*}"

          if [[ "$version" == *-* || "$major" == "0" ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "Versão estável $version: a publicação automática de prerelease será ignorada."
          fi

          if gh release view "v$version" >/dev/null 2>&1 && [[ "$FORCE_REPUBLISH" != "true" ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Release v$version já existe; publicação automática ignorada."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  windows:
    needs: channel
    if: needs.channel.outputs.prerelease == 'true' && needs.channel.outputs.publish == 'true'
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm install

      - name: Build and publish Windows release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "L.I.V.I.A. v__VERSION__"
          releaseBody: |
            L.I.V.I.A. v__VERSION__

            ### v0.9.1 — hotfix de distribuição e preparação das releases estáveis

            - impede republicação automática de uma versão já existente;
            - republicação passa a exigir ação manual explícita;
            - mantém checksum, backup atômico e recuperação automática da v0.9.0;
            - separa canal de atualização estável e prerelease;
            - prepara verificação Authenticode por publisher para a v1.0;
            - prepara AAB/APK Android release assinados para a v1.1;
            - valida o patch de assinatura Android contra o Gradle real gerado pelo Tauri;
            - Windows, Linux e Android continuam validados na mesma revisão;
            - checksums SHA-256 continuam publicados para todos os artefatos.

            O APK Android desta release continua sendo uma build debug ARM64 de protótipo. A distribuição Android pública e assinada continua planejada para a v1.1.

            Observação: a build Windows ainda não possui assinatura Authenticode confiável e pode acionar o SmartScreen.
          releaseDraft: false
          prerelease: true
          args: --bundles nsis

      - name: Publicar SHA-256 do instalador Windows
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1

          if (-not $installer) {
            throw "Instalador NSIS não encontrado para gerar checksum."
          }

          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksum = "$($installer.FullName).sha256"
          Set-Content -Path $checksum -Value "$hash  $($installer.Name)" -NoNewline
          gh release upload "v$version" $checksum --clobber

  linux:
    needs: windows
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm install

      - name: Build and publish Linux packages
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "L.I.V.I.A. v__VERSION__"
          releaseDraft: false
          prerelease: true
          args: --bundles appimage,deb

      - name: Publicar SHA-256 dos pacotes Linux
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          shopt -s nullglob
          files=(
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          )

          if [ "${#files[@]}" -eq 0 ]; then
            echo "Nenhum pacote Linux encontrado para gerar checksum." >&2
            exit 1
          fi

          for installer in "${files[@]}"; do
            checksum="${installer}.sha256"
            hash="$(sha256sum "$installer" | awk '{print $1}')"
            printf '%s  %s' "$hash" "$(basename "$installer")" > "$checksum"
            gh release upload "v$version" "$checksum" --clobber
          done

  android:
    needs: windows
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android platform and NDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rust + Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm install

      - name: Initialize Tauri Android project
        run: npm run tauri -- android init --ci

      - name: Generate official Android launcher icons
        run: npm run tauri -- icon public/livia/livia-mark.svg

      - name: Verify Android launcher icon assets
        shell: bash
        run: |
          set -euo pipefail
          test -f src-tauri/gen/android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          test -f src-tauri/gen/android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Build Android prototype APK
        run: npm run tauri -- android build --debug --apk --target aarch64

      - name: Publicar APK e SHA-256
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          apk="$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' | head -n 1)"

          if [ -z "$apk" ]; then
            echo "APK Android não encontrado." >&2
            exit 1
          fi

          publish="L.I.V.I.A._${version}_android-arm64-debug.apk"
          cp "$apk" "$publish"

          hash="$(sha256sum "$publish" | awk '{print $1}')"
          printf '%s  %s' "$hash" "$publish" > "${publish}.sha256"

          gh release upload "v$version" "$publish" "${publish}.sha256" --clobber
