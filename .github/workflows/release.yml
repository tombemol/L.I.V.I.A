name: Release Windows

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm install

      - name: Build and publish Windows release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "L.I.V.I.A. v__VERSION__"
          releaseBody: |
            L.I.V.I.A. v__VERSION__

            - desfazer seguro durante a sessão para itens identificados de forma inequívoca na Lixeira;
            - histórico de limpeza mais rico, sem persistir caminhos ou identificadores da Lixeira;
            - seleção assistida de cópias em grupos de duplicatas confirmadas;
            - Lívia reage à restauração e ao fluxo de duplicatas;
            - limpeza assistida com seleção múltipla e revisão antes da ação;
            - envio para a Lixeira do Windows, sem exclusão permanente;
            - validação do arquivo novamente antes da limpeza e proteção da pasta do Windows;
            - histórico local resumido das operações de limpeza;
            - Lívia reage à seleção e conclusão da limpeza;
            - índice de sessão e busca global sem revarrer o disco;
            - navegação instantânea pelo índice e aceleração NTFS/MFT quando disponível;
            - confirmação de duplicatas em duas etapas com BLAKE3;
            - cálculo do espaço potencialmente recuperável por duplicatas confirmadas;
            - modos Mapa/Pizza para pastas e Lista/Pizza para extensões;
            - preferências de visualização persistentes;
            - Lívia como guia contextual com os assets chibi oficiais;
            - expressões Normal, Feliz, Explicando, Julgando, Preocupada e Escaneando;
            - explicações contextuais para tipos de arquivo e comentários sobre duplicatas/arquivos antigos;
            - interface desktop com temas claro e escuro;
            - análise, hashing e recomendações continuam somente leitura.

            Observação: esta pré-release ainda não possui assinatura Authenticode. O Windows SmartScreen pode exibir "Fornecedor desconhecido" até a adoção de um certificado de code signing confiável.
          releaseDraft: false
          prerelease: true
          args: --bundles nsis
