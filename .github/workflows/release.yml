name: Release Windows

on:
  push:
    branches: ["main"]
    paths:
      - "package.json"
      - "src-tauri/Cargo.toml"
      - "src-tauri/tauri.conf.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm install

      - name: Build and publish Windows release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "L.I.V.I.A. v__VERSION__"
          releaseBody: |
            L.I.V.I.A. v__VERSION__

            ### Relatórios exportáveis

            - novo botão **Exportar** no dashboard;
            - JSON completo com relatório, snapshots locais e duplicatas confirmadas;
            - CSV preparado para Excel e similares, com BOM UTF-8 e separador por ponto e vírgula;
            - nome de arquivo sugerido com raiz analisada e horário;
            - exportação permanece totalmente local, sem envio de dados;
            - backend aceita apenas destinos JSON/CSV e limita cada exportação a 100 MB;
            - central de atualização continua mostrando notas da release, progresso e validação SHA-256.

            Observação: esta pré-release ainda não possui assinatura Authenticode. O Windows SmartScreen pode exibir "Fornecedor desconhecido" até a adoção de um certificado de code signing confiável.
          releaseDraft: false
          prerelease: true
          args: --bundles nsis

      - name: Publicar SHA-256 do instalador
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1

          if (-not $installer) {
            throw "Instalador NSIS não encontrado para gerar checksum."
          }

          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksum = "$($installer.FullName).sha256"
          Set-Content -Path $checksum -Value "$hash  $($installer.Name)" -NoNewline

          gh release upload "v$version" $checksum --clobber
